<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#0f2a1b"/>
      <stop offset=".55" stop-color="#07130c"/>
      <stop offset="1" stop-color="#020604"/>
    </radialGradient>
    <linearGradient id="ck" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1fd16b"/>
      <stop offset="1" stop-color="#7dffb2"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- рамка задачи с разрывом справа сверху, откуда «вылетает» галочка -->
  <path d="M300 128 H170 a42 42 0 0 0 -42 42 v172 a42 42 0 0 0 42 42 h172 a42 42 0 0 0 42 -42 V268"
        fill="none" stroke="#1d6b41" stroke-width="30" stroke-linecap="round"/>
  <path d="M186 252 l62 62 L398 140" fill="none" stroke="url(#ck)" stroke-width="46"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
